name: Test v0.4.3 unified upgrade fix

on:
  push:
    branches:
      - fix/v043-unified-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-tests:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run Windows unified bootstrap tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest scripts.tests.test_prepare_windows_unified_installer -v
          if ($LASTEXITCODE -ne 0) { throw "bootstrap tests failed" }

      - name: Install official v0.4.3 and verify capability boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/yyjeqhc/webcodex/releases/download/v0.4.3"
          $installer = Join-Path $env:RUNNER_TEMP "webcodex-v043.exe"
          $sums = Join-Path $env:RUNNER_TEMP "SHA256SUMS"
          Invoke-WebRequest -UseBasicParsing "$base/webcodex-desktop-v0.4.3-win32-x64-setup.exe" -OutFile $installer
          Invoke-WebRequest -UseBasicParsing "$base/SHA256SUMS" -OutFile $sums
          $line = Get-Content $sums | Where-Object { $_ -match 'webcodex-desktop-v0\.4\.3-win32-x64-setup\.exe$' } | Select-Object -First 1
          if (-not $line) { throw "missing checksum" }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "checksum mismatch" }
          $p = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "v0.4.3 install failed: $($p.ExitCode)" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WebCodex Desktop"
          $root = (Get-ItemProperty -LiteralPath $key).InstallLocation.Trim('"')
          $cli = Join-Path $root "webcodex-runtime\webcodex.exe"
          $version = ((& $cli --version) -join " ")
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '0\.4\.3') { throw "wrong legacy CLI: $version" }
          & $cli environment --help *> (Join-Path $env:RUNNER_TEMP "legacy-environment-help.txt")
          $legacyExit = $LASTEXITCODE
          if ($legacyExit -eq 0) { throw "v0.4.3 unexpectedly advertises environment support" }
          if (Test-Path (Join-Path $env:APPDATA "webcodex\environment\environment.json")) {
            throw "clean v0.4.3 unexpectedly has EnvironmentStore state"
          }
          "official v0.4.3 environment --help exit: $legacyExit"

      - name: Audit rendered legacy branch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content scripts\build_windows_unified_bootstrap.py -Raw
          $required = @(
            'environment --help',
            'StrCpy $WebCodexLegacyInstall 1',
            '$APPDATA\\webcodex\\environment\\environment.json',
            'Goto webcodex_run_inner_installer',
            'WebCodexLegacyBackup',
            'environment installer-verify-same'
          )
          foreach ($needle in $required) {
            if (-not $script.Contains($needle)) { throw "missing legacy bootstrap guard: $needle" }
          }
