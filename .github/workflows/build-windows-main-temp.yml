name: Build Windows main installer

on:
  push:
    branches:
      - build/windows-main-d0165f3

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 main installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: d0165f37911c6433ff48fee72458b2c4cd20168c
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: main-windows-installer

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix apps/desktop

      - name: Build exact Runtime
        id: runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne "d0165f37911c6433ff48fee72458b2c4cd20168c") { throw "Unexpected source SHA: $source" }
          $short = (git rev-parse --short=12 HEAD).Trim()
          $version = (node -e "console.log(require('./npm/webcodex/package.json').version)").Trim()
          $builtAt = [Int64]((git show -s --format=%ct HEAD).Trim())
          $env:WEBCODEX_BUILT_AT = "$builtAt"
          cargo build --locked --profile dogfood -p webcodex -p webcodex-cli -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "Runtime build failed" }
          "source=$source" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "built_at=$builtAt" >> $env:GITHUB_OUTPUT

      - name: Stage Desktop Runtime
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "webcodex-main-win32-x64"
          & .\scripts\prepare_desktop_bundle.ps1 -BinDir "target\dogfood" -Version "${{ steps.runtime.outputs.version }}" -SourceSha "${{ steps.runtime.outputs.source }}" -BuiltAt ([Int64]"${{ steps.runtime.outputs.built_at }}") -OutputDir $stage
          "config=$(Join-Path $stage 'tauri.bundle.conf.json')" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        id: installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE "target\desktop-main-win32-x64"
          npm exec tauri -- build --bundles nsis --config "${{ steps.bundle.outputs.config }}" --ci --no-sign -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri NSIS build failed" }
          $bundleDir = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $built = @(Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" -File)
          if ($built.Count -ne 1) { throw "Expected exactly one installer, found $($built.Count)" }
          $dist = Join-Path $env:GITHUB_WORKSPACE "target\desktop-dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $name = "webcodex-desktop-main-${{ steps.runtime.outputs.short }}-v${{ steps.runtime.outputs.version }}-win32-x64-setup.exe"
          $installer = Join-Path $dist $name
          Copy-Item -LiteralPath $built[0].FullName -Destination $installer
          "path=$installer" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Smoke Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\desktop_install_windows_smoke.ps1 -Installer "${{ steps.installer.outputs.path }}" -Version "${{ steps.runtime.outputs.version }}" -SourceSha "${{ steps.runtime.outputs.source }}" -BuiltAt ([Int64]"${{ steps.runtime.outputs.built_at }}") -Platform win32-x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: webcodex-main-win32-x64
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14
